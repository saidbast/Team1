<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Básica</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 300px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .campo {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input, select, button {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        .resultado {
            margin-top: 15px;
            padding: 10px;
            background-color: #f0f0f0;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Calculadora</h2>

    <form method="POST" action="">
        <div class="campo">
            <label for="num1">Número 1:</label>
            <input type="number" step="any" name="num1" id="num1" required value="<?php echo isset($_POST['num1']) ? htmlspecialchars($_POST['num1']) : ''; ?>">
        </div>

        <div class="campo">
            <label for="operacion">Operación:</label>
            <select name="operacion" id="operacion">
                <option value="suma" <?php if (isset($_POST['operacion']) && $_POST['operacion'] == 'suma') echo 'selected'; ?>>Suma (+)</option>
                <option value="resta" <?php if (isset($_POST['operacion']) && $_POST['operacion'] == 'resta') echo 'selected'; ?>>Resta (-)</option>
                <option value="multiplicacion" <?php if (isset($_POST['operacion']) && $_POST['operacion'] == 'multiplicacion') echo 'selected'; ?>>Multiplicación (×)</option>
                <option value="division" <?php if (isset($_POST['operacion']) && $_POST['operacion'] == 'division') echo 'selected'; ?>>División (÷)</option>
            </select>
        </div>

        <div class="campo">
            <label for="num2">Número 2:</label>
            <input type="number" step="any" name="num2" id="num2" required value="<?php echo isset($_POST['num2']) ? htmlspecialchars($_POST['num2']) : ''; ?>">
        </div>

        <button type="submit" name="calcular">Calcular</button>
    </form>

    <?php
    if ($_SERVER["REQUEST_METHOD"] == "POST" && isset($_POST['calcular'])) {
        $num1 = (float)$_POST['num1'];
        $num2 = (float)$_POST['num2'];
        $operacion = $_POST['operacion'];
        $resultado = 0;
        $error = '';

        switch ($operacion) {
            case 'suma':
                $resultado = $num1 + $num2;
                break;
            case 'resta':
                $resultado = $num1 - $num2;
                break;
            case 'multiplicacion':
                $resultado = $num1 * $num2;
                break;
            case 'division':
                if ($num2 != 0) {
                    $resultado = $num1 / $num2;
                } else {
                    $error = "Error: No se puede dividir por cero.";
                }
                break;
        }

        echo '<div class="resultado">';
        if ($error != '') {
            echo $error;
        } else {
            echo "Resultado: " . $resultado;
        }
        echo '</div>';
    }
    ?>

</body>
</html>
